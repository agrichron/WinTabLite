# WinTab Lite 配置
# 改完需要重启程序（托盘右键 → 退出，再双击 启动.cmd）

# 缩略图档位：standard（208x117）| compact（148x84）
thumb = standard

# 整体尺寸：auto = 按当前屏幕分辨率自动算（推荐）
#             也可以写数字 0.6~3.0 固定物理像素倍数
scale = auto

# 面板尺寸上限（占工作区的比例），超了就自动减列 / 缩小
max_width_ratio = 0.42
max_height_ratio = 0.90

# 排序方式：app_group 按应用分组（组按 exe 字母序，组内最近用过的在前）| zorder 纯 Z 序
sort = app_group

# 缩略图填充方式：cover（裁切填满，整齐）| contain（保留完整画面，四周留边）
fit = cover

# 缩略图右下角叠加应用图标：true | false
show_logo = true

# 图标底色：white 白底 | none 纯透明无底（当前）| dark 深色底
logo_bg = none

# Alt+` 全局热键唤出：true | false
hotkey = true

# 拦截系统 Alt+Tab（含 Alt+Shift+Tab），改为打开本面板：true | false
# 开启后原本的系统任务切换器不再弹出（属于接管系统快捷键）；改回 false 即可恢复
intercept_alt_tab = true

# 鼠标撞屏幕左边缘驻留唤出：true | false
edge_dwell = true

# 边缘触发的判定像素（越大越容易触发）
edge_px = 2

# 是否收录已最小化的窗口：true | false
include_minimized = true
